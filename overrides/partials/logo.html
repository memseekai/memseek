<!--
  The marketing site's brand mark: a dot filled with the orange→pink gradient.
  Inline SVG rather than a raster so it stays crisp and picks up the same two
  token colors the rest of the chrome uses.
-->
<svg class="ms-dot" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ms-dot-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a2f" />
      <stop offset="100%" stop-color="#ff3d67" />
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="10" fill="url(#ms-dot-grad)" />
</svg>
