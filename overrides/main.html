{% extends "base.html" %}

<!--
  Every page in docs/ carries an `eyebrow:` front-matter line — a kicker that
  says what kind of page this is before the title says what it is about. The
  readthedocs theme dropped it on the floor; here it renders above the H1 in
  the marketing site's .eyebrow treatment (mono, uppercase, tracked, rule).
-->
{% block content %}
  {% if page.meta and page.meta.eyebrow %}
    <p class="ms-eyebrow">{{ page.meta.eyebrow }}</p>
  {% endif %}
  {{ super() }}
{% endblock %}

<!--
  Cloudflare Web Analytics, the same tag the marketing site carries (see
  marketing/src/layouts/BaseLayout.astro) — keep the token in sync with it.
  Cookieless, so there is no consent banner to add. The token is public by
  design: it names the site, not the account. Docs traffic lands in the same
  Cloudflare site as memseek.ai, split out by hostname.

  extrahead is the only hook that works here: `extra_javascript` emits a plain
  <script src>, and the beacon needs its data-cf-beacon attribute. With
  navigation.instant on, Material swaps pages through the History API rather
  than reloading, and the beacon reports those as pageviews itself.
-->
{% block extrahead %}
  {{ super() }}
  <script
    type="module"
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token": "67a2850480074a469b3c209693e68b60"}'
  ></script>
{% endblock %}
