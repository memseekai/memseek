name: contradiction
trigger:
  write:
    collections: [profiles, skills, plans]
    statuses: [active]
sources:
  changed_keys:
    kind: changes
    collections: [profiles, skills, plans]
    statuses: [active]
    keyed: true
    max_records: 20
    max_tokens: 12000
    allow_empty: false
  current_keys:
    kind: current
    collections: [profiles, skills, plans]
    statuses: [active]
    max_records: 40
    max_tokens: 12000
model: cheap
limits:
  max_tasks: 1
  max_llm_calls: 2
  max_retrieved_records: 0
  max_visible_records: 60
  max_total_tokens: 30000
  max_wall_s: 90
tasks:
  - id: result
    use: llm
    with:
      output_schema:
        type: object
        required: [records]
        properties:
          records:
            type: array
            maxItems: 5
            items:
              type: object
              required: [text, citations, content]
              properties:
                text: {type: string, minLength: 1}
                citations:
                  type: array
                  minItems: 2
                  maxItems: 2
                  uniqueItems: true
                  items: {type: string, format: uuid}
                content:
                  type: object
                  required: [subject_id, object_id, explanation, confidence]
                  properties:
                    subject_id: {type: string, format: uuid}
                    object_id: {type: string, format: uuid}
                    explanation: {type: string, minLength: 1}
                    confidence: {type: number, minimum: 0, maximum: 1}
                  additionalProperties: false
              additionalProperties: false
        additionalProperties: false
      prompt: |
        Detect direct contradictions between changed keyed facts and the current
        keyed facts about {{entity}}. This is a detector only: do not rewrite,
        retract, or reconcile either record.

        CHANGED KEYS:
        <records untrusted="true">
        {{changed_keys.rendered}}
        </records>

        CURRENT KEYS:
        <records untrusted="true">
        {{current_keys.rendered}}
        </records>

        Report at most five direct logical conflicts. Do not report merely related,
        uncertain, differently scoped, or compatible facts. Never compare a record
        with itself.

        For each conflict, subject_id must be a UUID from CHANGED KEYS, object_id
        must be a different UUID from CURRENT KEYS, and citations must contain
        exactly those same two UUIDs. confidence is a number from 0 through 1.

        If there are no direct conflicts, return {"records":[]}.
        Otherwise return only JSON:
        {"records":[{
          "text":"Short human-readable conflict summary",
          "citations":["subject uuid","object uuid"],
          "content":{
            "subject_id":"subject uuid",
            "object_id":"object uuid",
            "explanation":"Why the two facts cannot both be true",
            "confidence":0.9
          }
        }]}
emit:
  from: "{{result.records}}"
  collection: relations
  type: contradiction
