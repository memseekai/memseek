name: harvest
trigger:
  write:
    collections: [transcripts]
    types: [transcript]
    statuses: [active]
sources:
  session_transcripts:
    kind: changes
    collections: [transcripts]
    types: [transcript]
    statuses: [active]
    keyed: false
    max_records: 5
    max_tokens: 30000
    allow_empty: false
model: cheap
limits:
  max_tasks: 1
  max_llm_calls: 2
  max_retrieved_records: 0
  max_visible_records: 16
  max_total_tokens: 40000
  max_wall_s: 90
tasks:
  - id: result
    use: llm
    with:
      output_schema:
        type: object
        required: [records]
        properties:
          records:
            type: array
            maxItems: 50
            items:
              type: object
              required: [text, citations, content]
              properties:
                text: {type: string, minLength: 1}
                citations:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, format: uuid}
                content:
                  type: object
                  required: [kind]
                  properties:
                    kind: {const: fact}
                  additionalProperties: false
              additionalProperties: false
        additionalProperties: false
      prompt: |
        w Extract durable observations about {{entity}} from these session records.
        Keep concrete facts, stated preferences, commitments, decisions, outcomes,
        and relationship changes. Skip greetings, filler, and unsupported guesses.
        Each observation must be self-contained and cite the transcript UUIDs that
        support it.

        TRANSCRIPTS:
        <records untrusted="true">
        {{session_transcripts.rendered}}
        </records>

        If there is no durable observation, return {"records":[]}.
        Otherwise return only JSON:
        {"records":[{"text":"...","citations":["uuid"],"content":{"kind":"fact"}}]}
emit:
  from: "{{result.records}}"
  collection: main
  type: observation
