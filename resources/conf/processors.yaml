# yaml-language-server: $schema=../../schemas/processors.schema.json
processors:
  - name: embedding_v1
    kind: embedding
    input:
      collections:
        [main, profiles, reflections, skills, plans, transcripts, outcomes, calendar_events, relations, worldview]

  - name: importance
    kind: score
    source: llm
    input: {collections: [main, outcomes, calendar_events]}
    scale: [1, 10]
    default: 5
    render: true
    model: importance_scorer
    prompt: |
      SCORER: importance
      Rate the long-term significance of each record from 1 to 10.
      A 1 is routine and disposable. A 10 is likely to change future
      decisions, plans, relationships, obligations, or identity.
      Return only a JSON array of numbers in the same order as the records.

  - name: sentiment_v1
    kind: json
    source: llm
    input:
      collections: [main]
      types: [chat, message]
    model: cheap
    prompt: |
      Classify sentiment as negative, neutral, or positive and give confidence.
    output_schema:
      type: object
      required: [label, confidence]
      properties:
        label: {type: string, enum: [negative, neutral, positive]}
        confidence: {type: number, minimum: 0, maximum: 1}
    default_output: {label: neutral, confidence: 0}
    score_fields:
      sentiment_confidence: confidence

  # Judgment-model processors. They need the `jev` alias in conf/models.yaml
  # and TYPESAFE_API_KEY. Enable one by uncommenting it and listing it under
  # `processors:` in catalog.yaml and in a collection's processor bindings.
  #
  # A fast importance scorer: one score question mapped onto the scale. The
  # annotation keeps the raw answer, probabilities included, beside the value.
  # - name: importance_jev
