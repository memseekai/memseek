# Named endpoints. A provider is a connection, not a vendor: entries may share
# an adapter and differ only in base_url. Keys are yours to choose; alias targets
# and the embedding block below refer to them by that name.
providers:
  openai:
    adapter: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

aliases:
  cheap:
    targets: ["openai:gpt-5.4-2026-03-05"]
    params: {temperature: 0, max_output_tokens: 1200}
    context_tokens: 60000

  strong:
    targets:
      - "openai:gpt-5.4-2026-03-05"
    params: {temperature: 0, max_output_tokens: 4000}
    context_tokens: 120000

  importance_scorer:
    targets: ["openai:gpt-5.4-2026-03-05"]
    params: {temperature: 0, max_output_tokens: 800}
    context_tokens: 60000

# The one embedding model, declared in full. Every field here is part of what a
# stored vector means, so changing any of them means changing `space` too and
# running a staged re-embed (see docs/changing-definitions.md).
embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536
  space: default-v1
  batch: 64
  max_text_chars: 16000

defaults:
  derivation: strong
  fold: strong
