site_name: Memseek
site_description: Declarative, provenance-aware memory for agentic applications.
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: readthedocs

markdown_extensions:
  - admonition
  - attr_list
  - meta
  - tables
  - toc:
      permalink: true
  # Renders ```mermaid blocks as diagrams instead of code.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          # div, not code: this emits <div class="mermaid">…</div>, which is
          # exactly what mermaid's startOnLoad scans for.
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js
  - javascripts/mermaid-init.js

