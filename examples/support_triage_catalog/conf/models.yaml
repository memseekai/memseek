# yaml-language-server: $schema=../../../schemas/models.schema.json
providers:
  openai:
    adapter: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  # TypeSafe serves System One judgment models. They answer typed questions
  # about a state and write no text, so they only fit `source: judgment`
  # processors and `judge` Tasks.
  typesafe:
    adapter: typesafe
    base_url: https://api.typesafe.ai
    api_key_env: TYPESAFE_API_KEY
    json_capability: none

aliases:
  # Writes the escalation notes.
  strong:
    targets: ["openai:gpt-5.4-2026-03-05"]
    params: {max_output_tokens: 4000}
    context_tokens: 120000

  # Pinned to one version: every keep threshold in this catalog was chosen
  # against jev-1.13.0, and jev-latest moves underneath you.
  jev:
    targets: ["typesafe:jev-1.13.0"]

embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536
  space: default-v1

defaults:
  derivation: strong
  fold: strong
