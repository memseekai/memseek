# yaml-language-server: $schema=../../../schemas/toolsets.schema.json
toolsets:
  - name: worker_tools
    version: 1
    title: Worker tools
    instructions: Keep working files in /workspace. Load the task skill before starting.
    sources:
      - name: workspace
        kind: filesystem
        description: Read and write working files in the Computer workspace.
        root: /workspace
        modes: [read, ls, find, grep, write, edit]
      - name: shell
        kind: exec
        description: Run a command inside the Computer.
      # The skill the learning loop improves, rendered from this entity's
      # reviewed `skills` records on every run.
      - name: task_skill
        kind: skill
        artifact: learned_skill@1
        skill_name: task-skill
