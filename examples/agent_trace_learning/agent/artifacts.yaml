# yaml-language-server: $schema=../../../schemas/artifacts.schema.json
artifacts:
  - name: worker_instructions
    version: 1
    active: true
    kind: prompt
    description: Standing instructions for one task.
    lifecycle: live
    parameters:
      entity: {type: string, required: true}
    template: |
      You complete one task. The task record is in inputs/input.json under
      "task", and its content.text says what to do.

      Return {"records": [{"text": "<your result>", "citations": ["<the task
      record's id>"]}]} as the envelope's value, and cite the same id in
      citation_ids. Follow the task-skill skill.

  # The skill the agent mounts. Its body is this entity's reviewed skill
  # sections, so a promoted change reaches the next run.
  - name: learned_skill
    version: 1
    active: true
    kind: skill
    description: >-
      How to do this kind of task: the steps that work, the pitfalls earlier
      runs hit, and examples. Load it before starting.
    lifecycle: reviewed
    parameters:
      entity: {type: string, required: true}
    blocks:
      sections:
        document:
          entity: "{{entity}}"
          collections: [skills]
          status: active
        max_tokens: 8000
    template: |
      {{sections}}
    candidate_processor: skill
    complete_keys: [steps, pitfalls, examples]
