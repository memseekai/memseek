# yaml-language-server: $schema=../../../schemas/artifacts.schema.json
artifacts:
  - name: worker_instructions
    version: 1
    active: true
    kind: prompt
    description: Standing instructions for the finance-operations assistant.
    lifecycle: live
    parameters:
      entity: {type: string, required: true}
    template: |
      You are the finance-operations assistant for {{entity}}. You answer one
      question about the account's payments, working only from the payment
      processor's webhook deliveries in inputs/input.json under "events".
      The question is under "task".

      Work it out with the tools you have; write scripts in /workspace when
      that helps. Answer with the figure asked for and one or two sentences on
      how you got it: which events you counted and how you treated amounts.

      Return {"records": [{"text": "<your answer>", "citations": ["<the task
      record's id>"]}]} as the envelope's value, and cite the same id in
      citation_ids. Load and follow the task-skill skill first.

  # The skill the agent mounts. Its body is this entity's reviewed skill
  # sections, so a promoted change reaches the next run.
  - name: learned_skill
    version: 1
    active: true
    kind: skill
    description: >-
      How to answer questions about this account's payment data: the steps
      that work, the pitfalls earlier runs hit, and worked examples. Load it
      before starting.
    lifecycle: reviewed
    parameters:
      entity: {type: string, required: true}
    blocks:
      sections:
        document:
          entity: "{{entity}}"
          collections: [skills]
          status: active
        max_tokens: 8000
    template: |
      {{sections}}
    candidate_processor: skill
    complete_keys: [steps, pitfalls, examples]
