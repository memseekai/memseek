views:
  - name: graph_query
    version: 1
    active: true
    kind: graph
    graph:
      edges: edges
    parameters:
      seed:
        type: string
        required: true
        description: Starting page key or entity identifier.
        min_length: 1
        max_length: 128
      predicates:
        type: string_array
        default: []
        description: Optional edge predicates to follow (works_at, invested_in, founded, advises, attended, mentions, image_of, or wikilink_basename); omit for every predicate.
        item_enum: [works_at, invested_in, founded, advises, attended, mentions, image_of, wikilink_basename]
        max_items: 8
      direction:
        type: string
        default: out
        description: Which edge direction to traverse from the seed.
        enum: [out, in, both]
      # These maxima are the *deployment* ceilings, not the protocol ceilings.
      # A graph view's parameter names, types, and defaults are fixed by the
      # loader; the bounds are the author's, and they are the only source for
      # the generated MCP schema. Declaring more than MAX_GRAPH_DEPTH (default
      # 4) or MAX_GRAPH_PATHS (default 100) advertises a range the traversal
      # rejects with 422. Raise them only alongside those settings.
      depth:
        type: integer
        default: 1
        description: Maximum number of graph hops to follow.
        minimum: 1
        maximum: 4
      limit:
        type: integer
        default: 20
        description: Maximum number of paths to return.
        minimum: 1
        maximum: 100
