collections:
  - name: concepts
    version: 1
    active: true
    mode: keyed
    schema:
      type: object
      required: [text, concepts, truncated, omitted_concepts]
      properties:
        text: {type: string, minLength: 1}
        concepts:
          type: array
          maxItems: 12
          items:
            type: object
            required: [title, text, confidence]
            properties:
              title: {type: string, minLength: 1, maxLength: 80}
              text: {type: string, minLength: 1, maxLength: 280}
              confidence: {type: number, minimum: 0, maximum: 1}
            additionalProperties: false
        truncated: {type: boolean}
        omitted_concepts: {type: integer, minimum: 0}
        tombstone: {type: boolean}
      additionalProperties: false
    fields:
      truncated: {path: content.truncated, type: boolean, filter: true, project: true}
    required_processors: [embedding_v1]
    search_profile: pg_default
    answerable: true
