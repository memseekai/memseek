# Point these targets at models your own account can call. Both completion
# aliases deliberately name the same model here, so the cheap/strong split is
# only a token-budget distinction in this example, not two price tiers -- every
# gbrain Pipeline selects `cheap` except repair_synthesis, which selects
# `strong`. Nothing falls through to defaults.derivation as a result.

# Named endpoints. Alias targets and the embedding block refer to a provider by
# the key you choose here; the credential stays in the environment.
providers:
  openai:
    adapter: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

aliases:
  cheap:
    targets: ["openai:gpt-5.4-2026-03-05"]
    params: {temperature: 0, max_output_tokens: 1200}
    context_tokens: 60000

  strong:
    targets: ["openai:gpt-5.4-2026-03-05"]
    params: {temperature: 0, max_output_tokens: 4000}
    context_tokens: 120000

embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536
  space: default-v1

defaults:
  derivation: strong
  fold: strong
