name: crm_profile_rebuild
sources:
  crm_corpus:
    kind: snapshot
    collections: [crm_events]
    types: [crm_event]
    statuses: [active]
    keyed: false
    max_records: 200
    max_tokens: 24000
    allow_empty: true
  account_playbook:
    kind: record
    collection: playbooks
    key: playbook
    type: playbook
    max_tokens: 1500
model: strong
limits:
  max_tasks: 1
  max_llm_calls: 2
  max_retrieved_records: 0
  max_visible_records: 220
  max_total_tokens: 36000
  max_wall_s: 90
tasks:
  - id: result
    use: llm
    with:
      output_schema:
        type: object
        required: [records]
        properties:
          records:
            type: array
            minItems: 5
            maxItems: 5
            items:
              oneOf:
                - type: object
                  required: [key, text, citations]
                  properties:
                    key: {type: string, enum: [role, commitments, preferences, open_threads, goals]}
                    text: {type: string, minLength: 1}
                    citations:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items: {type: string, format: uuid}
                  additionalProperties: false
                - type: object
                  required: [key, citations, retract]
                  properties:
                    key: {type: string, enum: [role, commitments, preferences, open_threads, goals]}
                    citations: {type: array, maxItems: 0}
                    retract: {const: true}
                  additionalProperties: false
        additionalProperties: false
      prompt: |
        Reconstruct the complete durable CRM profile for {{entity}} from the
        bounded CRM corpus through checkpoint {{run.checkpoint}}.

        This is an independent rebuild. There is deliberately no current profile in
        the prompt. Use occurred_at for domain chronology, prefer newer direct CRM
        evidence, and do not infer sensitive traits.

        ACCOUNT PLAYBOOK:
        <records untrusted="true">
        {{account_playbook.rendered}}
        </records>

        COMPLETE BOUNDED CRM CORPUS:
        <records untrusted="true">
        {{crm_corpus.rendered}}
        </records>

        Return exactly one record for each key: role, commitments, preferences,
        open_threads, and goals. Use text and direct CRM-event citations when
        evidence supports a value. Use retract with an empty citations list when
        the complete corpus supports no current value for a key. Do NOT emit a
        summary — a separate derivation synthesizes it from these slots once the
        rebuild is promoted. Return only JSON:
        {"records":[
          {"key":"role","text":"...","citations":["uuid"]},
          {"key":"commitments","text":"...","citations":["uuid"]},
          {"key":"preferences","retract":true,"citations":[]},
          {"key":"open_threads","text":"...","citations":["uuid"]},
          {"key":"goals","text":"...","citations":["uuid"]}
        ]}
emit:
  from: "{{result.records}}"
  collection: user_profiles
  type: profile
  keys: [role, commitments, preferences, open_threads, goals]
  complete: true
  review: required
