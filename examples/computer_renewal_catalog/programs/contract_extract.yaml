programs:
  - name: contract_extract
    version: 3
    active: true
    runtime: worker-javascript
    entrypoint: main.js
    files:
      main.js: |
        export default async function (input) {
          const records = input.contracts || [];
          return {records: records.map((row) => ({
            text: `Extracted renewal term from: ${row.content.text}`,
            citations: [row.id],
            content: {kind: "contract_term", value: row.content.text}
          }))};
        }
    input_schema:
      type: object
      required: [contracts]
      properties:
        contracts: {type: array, maxItems: 20}
      additionalProperties: false
    output_schema:
      type: object
      required: [records]
      properties:
        records:
          type: array
          maxItems: 20
          items:
            type: object
            required: [text, citations, content]
            properties:
              text: {type: string, minLength: 1}
              citations:
                type: array
                minItems: 1
                uniqueItems: true
                items: {type: string, format: uuid}
              content:
                type: object
                required: [kind, value]
                properties:
                  kind: {const: contract_term}
                  value: {type: string}
                additionalProperties: false
            additionalProperties: false
      additionalProperties: false
    capabilities: [filesystem]

