name: renewal_assessment
trigger:
  cron: {expr: "0 2 * * *", entities: dirty}
sources:
  renewal_basis:
    kind: snapshot
    collections: [renewal_evidence, contract_terms]
    statuses: [active]
    keyed: any
    window: {recent: 100}
    max_records: 100
    max_tokens: 30000
    allow_empty: false
limits:
  max_tasks: 1
  max_llm_calls: 0
  max_retrieved_records: 0
  max_visible_records: 100
  max_total_tokens: 45000
  max_wall_s: 180
  max_computer_runs: 1
  max_agent_steps: 24
  max_computer_output_bytes: 1048576
  max_preserved_bytes: 10485760
tasks:
  - id: assessment
    use: agent
    input:
      objective: Identify renewal risks, including promises contradicted by incidents.
      evidence: "{{renewal_basis.records}}"
    with:
      agent: renewal_analyst@1
      computer: research_workspace@1
      context_policy: evidence_spine@1
      output: /outbox/final-result.json
      max_steps: 24
      output_schema:
        type: object
        required: [records]
        properties:
          records:
            type: array
            maxItems: 10
            items:
              type: object
              required: [text, citations, content]
              properties:
                text: {type: string, minLength: 1}
                citations:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {type: string, format: uuid}
                content:
                  type: object
                  required: [kind, severity]
                  properties:
                    kind: {const: renewal_risk}
                    severity: {type: string, enum: [low, medium, high]}
                  additionalProperties: false
              additionalProperties: false
        additionalProperties: false
emit:
  from: "{{assessment.records}}"
  collection: renewal_risks
  type: renewal_risk
  max_records: 10
