# yaml-language-server: $schema=../../../schemas/collections.schema.json
collections:
  - name: main
    version: 1
    active: true
    mode: event
    schema:
      type: object
      required: [text]
      properties:
        text: {type: string}
      additionalProperties: true
    required_processors: [embedding_v1, importance, intent_v1]
    search_profile: pg_default

  - name: plans
    version: 1
    active: true
    mode: event
    schema:
      type: object
      required: [text]
      properties:
        text: {type: string}
        kind: {type: string}
        owner: {type: string}
        due: {type: string}
      additionalProperties: false
    required_processors: [embedding_v1]
    search_profile: pg_default

  - name: support
    version: 1
    active: true
    mode: event
    schema:
      type: object
      required: [text]
      properties:
        text: {type: string}
        body: {type: string}
      additionalProperties: false
    required_processors: [embedding_v1, importance]
    search_profile: pg_default

  - name: ticket_labels
    version: 1
    active: true
    mode: event
    schema:
      type: object
      required: [text, kind, judgment]
      properties:
        text: {type: string}
        kind: {const: ticket_label}
        judgment: {type: object}
      additionalProperties: false
    required_processors: [embedding_v1]
    search_profile: pg_default
