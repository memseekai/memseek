# yaml-language-server: $schema=../../../schemas/derivations.schema.json
# B. A pure labeller with no LLM: Jev's answers become the records. Tickets
# below the confidence bar are not labelled, so a human sees them instead.
name: ticket_triage
sources:
  tickets:
    kind: changes
    collections: [support]
    max_records: 200
limits: {max_llm_calls: 0, max_judgments: 200}
tasks:
  - id: labels
    use: judge
    input: "{{tickets.records}}"
    with:
      model: jev
      questions:
        team:
          type: choice
          instructions: "Which team should handle `item.content.body`?"
          criteria:
            billing: "Payments, refunds"
            technical: "Bugs, outages"
            sales: "Pricing, upgrades"
      keep: {team: {confidence_gte: 0.6}}
      records:
        text: "{{item.content.text}}"
        content: {kind: ticket_label}
emit:
  from: "{{labels.records}}"
  collection: ticket_labels
  type: label
  max_records: 100
