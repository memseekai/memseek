collections:
  # What to scrape. The demo writes one before each run, and the Agent's
  # instructions render the latest one, which is what makes it citable: every
  # learning the Agent writes back cites the task it was learned on.
  - name: scrape_tasks
    version: 1
    active: true
    mode: event
    schema:
      type: object
      required: [text, url, goal]
      properties:
        text: {type: string, minLength: 1}
        url: {type: string, minLength: 1, maxLength: 2048}
        goal: {type: string, minLength: 1, maxLength: 1000}
      additionalProperties: false
    required_processors: []
    search_profile: pg_default

  # What any learning skill pack learned about a site, one record per lesson.
  # Generic across packs: `pack` says whose lesson it is. The `[<pack>/<kind>]`
  # prefix on `text` is the one part of a lesson the rendered playbook shows,
  # so the schema holds every writer to it.
  - name: skill_learnings
    version: 1
    active: true
    mode: event
    schema:
      type: object
      required: [text, pack, kind, detail]
      properties:
        text:
          type: string
          pattern: "^\\[[a-z][a-z0-9._-]{0,63}/(navigation|extraction|pitfall|helper)\\] [^\\n]{1,480}$"
        pack: {type: string, pattern: "^[a-z][a-z0-9._-]{0,63}$"}
        kind: {type: string, enum: [navigation, extraction, pitfall, helper]}
        detail: {type: string, minLength: 1, maxLength: 4000}
        helper_code: {type: string, maxLength: 8000}
      additionalProperties: false
    fields:
      pack: {path: content.pack, type: string, filter: true, project: true}
      kind: {path: content.kind, type: string, filter: true, project: true}
    required_processors: []
    search_profile: pg_default

  # One row per eval run: `memseek eval skill-learning` writes these, and each
  # links to the invocation whose receipt holds the full journal.
  - name: skill_eval_runs
    version: 1
    active: true
    mode: event
    schema:
      type: object
      required: [text, task, arm, trial, phase, k_train, pass, score, metrics, invocation_id]
      properties:
        text: {type: string, minLength: 1}
        task: {type: string, minLength: 1}
        arm: {type: string, enum: [cold, native, playbook, playbook+native]}
        trial: {type: integer, minimum: 0}
        phase: {type: string, enum: [train, test]}
        k_train: {type: integer, minimum: 0}
        pass: {type: boolean}
        score: {type: number, minimum: 0, maximum: 1}
        metrics: {type: object}
        invocation_id: {type: string, minLength: 1}
        harness: {type: object}
        skillpacks: {type: array}
      additionalProperties: false
    fields:
      arm: {path: content.arm, type: string, filter: true, project: true}
      task: {path: content.task, type: string, filter: true, project: true}
    required_processors: []
    search_profile: pg_default
