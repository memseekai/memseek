toolsets:
  - name: scraper
    version: 1
    title: Site scraper tools
    instructions: >-
      Keep working notes and scratch scripts in /workspace. Drive the browser
      through the browser-harness skill rather than fetching pages by hand.
    sources:
      - name: workspace
        kind: filesystem
        description: Read and write working files in the Computer workspace.
        root: /workspace
        modes: [read, ls, find, grep, write, edit]

      - name: shell
        kind: exec
        description: Run a command inside the Computer.

      # The pack brings its own skill, requirements, and capabilities; the
      # catalog checks that scrape_workspace@1 allows all of them.
      - name: browser
        kind: skillpack
        pack: browser-harness
