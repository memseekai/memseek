# yaml-language-server: $schema=../../../schemas/agents.schema.json
agents:
  - name: site_scraper
    version: 1
    active: true
    model: scraper
    instructions: scraper_instructions@1
    toolset: scraper@1
    # The agent loop is the pi harness in harnesses/pi/. Swapping it for
    # another harness is a new directory there and this one line.
    harness: pi
    computers: [scrape_workspace@1]
    context_policy: scrape_budget@1
    limits: {max_steps: 60, max_wall_s: 900, max_output_bytes: 1048576}
